<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" role="img" aria-labelledby="title desc">
  <title id="title">Geodesic cost-to-goal field</title><desc id="desc">A floorplan colored by geodesic distance, with a path from agent to goal routed through doorways.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#d9f3bc"/><stop offset=".38" stop-color="#63c9a5"/><stop offset=".7" stop-color="#197d8f"/><stop offset="1" stop-color="#142f57"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#12233a" flood-opacity=".12"/></filter>
    <style>.eyebrow{font:700 13px Inter,Arial;letter-spacing:1.7px;fill:#65758b}.title{font:700 25px Manrope,Inter,Arial;fill:#172334}.small{font:600 13px Inter,Arial;fill:#536176}.contour{fill:none;stroke:#fff;stroke-opacity:.25;stroke-width:2}.wall{stroke:#fff;stroke-width:18;stroke-linecap:square}.route{fill:none;stroke:#ffb15c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="880" height="610" rx="24" fill="#f7f9fc"/>
  <text x="42" y="47" class="eyebrow">GROUND-TRUTH NAVMESH SIGNAL</text><text x="42" y="82" class="title">Geodesic cost-to-goal field</text>
  <g transform="translate(42 112)" filter="url(#shadow)">
    <rect width="676" height="438" rx="16" fill="url(#field)"/>
    <path d="M15 385C135 310 211 271 304 213S497 110 648 52" class="contour"/><path d="M6 321C132 265 198 225 290 176S481 82 625 23" class="contour"/><path d="M45 430C176 352 269 320 359 250S555 142 671 96" class="contour"/><path d="M182 438C283 377 340 344 427 278S575 190 674 151" class="contour"/>
    <path d="M244 0V164M244 222V438M0 264H173M225 264H383M383 0V103M383 157V438M383 296H514M570 296H676" class="wall"/>
    <path d="M96 374L198 306L294 306L350 247L350 132L446 132L536 206L603 206L617 118" class="route"/>
    <circle cx="96" cy="374" r="10" fill="#fff" stroke="#172334" stroke-width="3"/><text x="116" y="380" class="small">agent</text>
    <circle cx="617" cy="118" r="15" fill="#ffd166" stroke="#fff" stroke-width="4"/><path d="M617 98v40M597 118h40" stroke="#172334" stroke-width="2"/><text x="581" y="88" class="small" fill="#fff">goal</text>
  </g>
  <g transform="translate(754 140)"><rect width="22" height="382" rx="11" fill="url(#field)"/><text x="42" y="13" class="small">far</text><text x="42" y="378" class="small">near</text><text transform="translate(77 260) rotate(-90)" class="eyebrow">COST TO GOAL</text></g>
</svg>
