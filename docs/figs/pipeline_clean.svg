<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Costmap-conditioned PIRLNav architecture</title>
  <desc id="desc">Costmap and RGB inputs flow through separate encoders into a shared recurrent policy.</desc>
  <defs>
    <linearGradient id="cm" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#102a43"/><stop offset=".52" stop-color="#157a8a"/><stop offset="1" stop-color="#78d6b1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#182433" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9aa8b8"/></marker>
    <style>.label{font:700 14px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#66758a}.head{font:700 19px Inter,Arial,sans-serif;fill:#172334}.sub{font:400 13px Inter,Arial,sans-serif;fill:#68778b}.tag{font:700 12px Inter,Arial,sans-serif;fill:#fff}.line{stroke:#9aa8b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="430" rx="26" fill="#f7f9fc"/>
  <text x="56" y="51" class="label">ORACLE COSTMAP ARM</text>
  <text x="56" y="266" class="label">RGB BASELINE</text>

  <g filter="url(#shadow)">
    <rect x="56" y="79" width="190" height="126" rx="16" fill="#fff" stroke="#dfe6ef"/>
    <rect x="73" y="96" width="82" height="72" rx="10" fill="url(#cm)"/>
    <path d="M80 154C100 141 112 149 126 126S144 111 149 105" stroke="#fff" stroke-width="3" fill="none" opacity=".9"/>
    <circle cx="82" cy="154" r="4" fill="#fff"/><circle cx="149" cy="105" r="5" fill="#ffd166"/>
    <text x="170" y="119" class="head">Scene</text><text x="170" y="143" class="head">+ goal</text><text x="170" y="169" class="sub">HM3D</text>

    <rect x="297" y="79" width="205" height="126" rx="16" fill="#edf5ff" stroke="#b9d4fa"/>
    <text x="322" y="122" class="head">Geodesic field</text><text x="322" y="150" class="sub">multi-goal shortest path</text><text x="322" y="174" class="sub">over the navmesh</text>

    <rect x="553" y="79" width="205" height="126" rx="16" fill="#edf9f8" stroke="#a9ddd7"/>
    <text x="578" y="122" class="head">Depth projection</text><text x="578" y="150" class="sub">visible world points</text><text x="578" y="174" class="sub">+ cached field lookup</text>

    <rect x="809" y="79" width="145" height="126" rx="16" fill="#fff" stroke="#cdd8e7"/>
    <rect x="832" y="99" width="44" height="33" rx="7" fill="#3568e8"/><rect x="884" y="99" width="44" height="33" rx="7" fill="#172334"/>
    <text x="854" y="120" text-anchor="middle" class="tag">abs</text><text x="906" y="120" text-anchor="middle" class="tag">rel</text>
    <text x="881" y="158" text-anchor="middle" class="head">2-channel</text><text x="881" y="181" text-anchor="middle" class="sub">costmap</text>

    <rect x="56" y="292" width="190" height="96" rx="16" fill="#fff" stroke="#dfe6ef"/>
    <rect x="73" y="309" width="68" height="62" rx="9" fill="#d9bea9"/><path d="M73 351L96 333l16 10 29-25v53H73Z" fill="#80986d"/><circle cx="92" cy="326" r="8" fill="#fff2c5"/>
    <text x="158" y="332" class="head">RGB image</text><text x="158" y="358" class="sub">first-person view</text>

    <rect x="297" y="292" width="205" height="96" rx="16" fill="#fff7f2" stroke="#efd5c3"/>
    <text x="399" y="330" text-anchor="middle" class="head">Pretrained encoder</text><text x="399" y="356" text-anchor="middle" class="sub">OVRL · ResNet-50</text>

    <rect x="990" y="132" width="86" height="176" rx="18" fill="#172334"/>
    <text x="1033" y="177" text-anchor="middle" class="tag">SHARED</text><text x="1033" y="207" text-anchor="middle" style="font:700 18px Inter,Arial;fill:#fff">CNN</text><text x="1033" y="231" text-anchor="middle" style="font:700 18px Inter,Arial;fill:#fff">+ GRU</text>
    <circle cx="1033" cy="276" r="17" fill="#28b487"/><path d="M1025 276h16m-6-6 6 6-6 6" stroke="#fff" stroke-width="2" fill="none"/>
  </g>
  <path d="M246 142H297" class="line"/><path d="M502 142H553" class="line"/><path d="M758 142H809" class="line"/><path d="M954 142C976 142 971 188 990 188" class="line"/>
  <path d="M246 340H297" class="line"/><path d="M502 340C775 340 765 254 990 254" class="line"/>
  <text x="746" y="323" class="sub">only the input pathway changes</text>
</svg>
